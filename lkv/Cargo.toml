[package]
name = "lkv"
version = "0.2.1"
edition = "2024"
rust-version = "1.90"
autobenches = false
description = "A lightweight and fast embedded key-value store for Rust."
readme = "../README.md"
license-file = "../LICENSE"
documentation = "https://docs.rs/lkv"
repository = "https://github.com/nuskey8/lkv"

[features]
ffi = []
nightly = []

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
crc32c = "0.6.8"
fs2 = "0.4.3"
hashbrown = { version = "=0.16.1", default-features = false, features = ["inline-more"] }
memmap2 = "0.9.11"
rustc-hash = "=2.1.3"
xxhash-rust = { version = "=0.8.18", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3.5.0"

[[bench]]
name = "large_values"
harness = true
required-features = ["nightly"]

[[bench]]
name = "reopen"
harness = true
required-features = ["nightly"]

[[bench]]
name = "c_api"
harness = true
required-features = ["ffi", "nightly"]
