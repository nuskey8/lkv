[package]
name = "lkv-benchmarks"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false
autobenches = false

[dependencies]
lkv = { path = "../lkv" }
fjall = "3.1.8"
heed = "0.22.1"
jammdb = "0.11.0"
redb = "4.1.0"
rocksdb = { version = "0.24.0", default-features = false, features = ["lz4", "bindgen-runtime"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
sled = "0.34.7"
tempfile = "3.5.0"

[[bench]]
name = "comparison"
path = "comparison.rs"
harness = true

# Keep benchmark-only dependencies out of the main workspace lockfile and CI.
[workspace]
